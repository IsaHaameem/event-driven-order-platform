server:
  port: 8084

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://postgres-notification:5432/notification_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: kafka:19092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.orderplatform.notificationservice.event
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.orderplatform.notificationservice.event.OrderCreatedEventV1
    producer:
      # Used internally by @RetryableTopic to forward to retry/DLT topics
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
        request.timeout.ms: 30000
        delivery.timeout.ms: 60000

app:
  notification:
    simulated-failure-rate: 0.2
    always-fail-for-customer-id: ${APP_NOTIFICATION_ALWAYS_FAIL_FOR_CUSTOMER_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html