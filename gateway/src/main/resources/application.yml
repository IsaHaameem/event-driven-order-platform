server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 10s
          routes:
            - id: order-service
              uri: http://order-service:8081
              predicates:
                - Path=/api/orders/**

            - id: inventory-service
              uri: http://inventory-service:8082
              predicates:
                - Path=/api/inventory/**

            - id: email-service
              uri: http://email-service:8083
              predicates:
                - Path=/api/email/**

            - id: notification-service
              uri: http://notification-service:8084
              predicates:
                - Path=/api/notifications/**

            - id: analytics-service
              uri: http://analytics-service:8085
              predicates:
                - Path=/api/analytics/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO