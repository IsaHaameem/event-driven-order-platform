name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - order-service
          - inventory-service
          - email-service
          - notification-service
          - analytics-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build ${{ matrix.service }} (tests skipped — no Kafka/Postgres in this job yet)
        working-directory: ./${{ matrix.service }}
        run: mvn -B clean package -DskipTests

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - order-service
          - inventory-service
          - email-service
          - notification-service
          - analytics-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image for ${{ matrix.service }}
        run: docker build -t order-platform/${{ matrix.service }}:ci ./${{ matrix.service }}
